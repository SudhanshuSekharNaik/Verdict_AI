services:
  - type: web
    name: verdict-ai-backend
    runtime: python
    plan: free
    healthCheckPath: /health
    buildCommand: pip install -r backend/requirements-deploy.txt
    startCommand: cd backend && PYTHONPATH=/opt/render/project/src uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: GROQ_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////tmp/aadalat.db
      - key: BACKEND_CORS_ORIGINS
        value: "*"
